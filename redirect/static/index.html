<!doctype html>
<!-- No text in this file: every string comes from strings.json through data-i18n* attributes (see app.js). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="app.title"></span></h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </div>
    </header>

    <main class="wrap layout" id="main" hidden>
      <section class="list-section" aria-labelledby="list-title">
        <div class="list-head">
          <h2 id="list-title" tabindex="-1"><span data-i18n="list.title"></span> <span class="count" id="count"></span></h2>
          <div class="filter" id="filter-box" hidden>
            <label for="filter" class="visually-hidden" data-i18n="list.filter.label"></label>
            <input id="filter" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="list.filter.placeholder" />
          </div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
        <ul id="list" class="list"></ul>
        <div id="empty" class="empty" hidden>
          <p class="empty-title" data-i18n="list.empty.title"></p>
          <p data-i18n="list.empty.text"></p>
        </div>
        <p id="no-match" class="empty" hidden></p>
      </section>

      <section class="card create" id="create" aria-labelledby="create-title">
        <h2 id="create-title" data-i18n="form.create.title"></h2>
        <form id="create-form" class="redirect-form" novalidate>
          <div class="field field-slug">
            <label for="create-slug" data-i18n="form.slug.label"></label>
            <div class="prefixed">
              <span class="prefix" data-base-url aria-hidden="true"></span>
              <input id="create-slug" name="slug" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="create-slug-hint create-slug-error" />
            </div>
            <p class="hint" id="create-slug-hint" data-i18n="form.slug.hint"></p>
            <p class="field-error" id="create-slug-error" hidden></p>
          </div>
          <div class="field">
            <label for="create-name" data-i18n="form.name.label"></label>
            <input id="create-name" name="name" type="text" autocomplete="off" aria-describedby="create-name-hint create-name-error" />
            <p class="hint" id="create-name-hint" data-i18n="form.name.hint"></p>
            <p class="field-error" id="create-name-error" hidden></p>
          </div>
          <div class="field field-target">
            <label for="create-target" data-i18n="form.target.label"></label>
            <input id="create-target" name="target" type="url" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="create-target-hint create-target-error" />
            <p class="hint" id="create-target-hint" data-i18n="form.target.hint"></p>
            <p class="field-error" id="create-target-error" hidden></p>
          </div>
          <p class="form-error" role="alert" hidden></p>
          <div class="form-actions">
            <button type="submit" class="button primary" data-i18n="form.create.submit"></button>
          </div>
        </form>
      </section>
    </main>

    <div class="wrap">
      <p id="load-error" class="status status-error" role="alert" hidden></p>
    </div>

    <template id="item-template">
      <li class="item">
        <div class="item-main">
          <div class="item-link">
            <a class="link" target="_blank" rel="noopener noreferrer"></a>
            <button type="button" class="button copy" data-action="copy" data-i18n="list.copy"></button>
          </div>
          <p class="item-name"></p>
          <p class="item-target"><span class="target-label" data-i18n="list.target.label"></span> <span class="target-url"></span></p>
        </div>
        <div class="item-actions">
          <button type="button" class="button" data-action="edit" data-i18n="list.edit"></button>
          <button type="button" class="button danger-ghost" data-action="delete" data-i18n="list.delete"></button>
        </div>
      </li>
    </template>

    <dialog id="edit-dialog" class="dialog" aria-labelledby="edit-title">
      <form id="edit-form" class="redirect-form" novalidate>
        <h2 id="edit-title" data-i18n="form.edit.title"></h2>
        <div class="field field-slug">
          <label for="edit-slug" data-i18n="form.slug.label"></label>
          <div class="prefixed">
            <span class="prefix" data-base-url aria-hidden="true"></span>
            <input id="edit-slug" name="slug" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="edit-slug-warning edit-slug-error" />
          </div>
          <!-- Empty until the path differs from the saved one: announced when it appears, never read before -->
          <p class="warning" id="edit-slug-warning" aria-live="polite"></p>
          <p class="field-error" id="edit-slug-error" hidden></p>
        </div>
        <div class="field">
          <label for="edit-name" data-i18n="form.name.label"></label>
          <input id="edit-name" name="name" type="text" autocomplete="off" aria-describedby="edit-name-error" />
          <p class="field-error" id="edit-name-error" hidden></p>
        </div>
        <div class="field">
          <label for="edit-target" data-i18n="form.target.label"></label>
          <input id="edit-target" name="target" type="url" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="edit-target-error" />
          <p class="field-error" id="edit-target-error" hidden></p>
        </div>
        <p class="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button type="button" class="button" data-action="close" data-i18n="form.cancel"></button>
          <button type="submit" class="button primary" data-i18n="form.edit.submit"></button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="dialog dialog-small" aria-labelledby="delete-title" aria-describedby="delete-text">
      <h2 id="delete-title" data-i18n="delete.title"></h2>
      <p id="delete-name" class="delete-name"></p>
      <p id="delete-text"></p>
      <div class="form-actions">
        <button type="button" class="button" data-action="close" data-i18n="delete.cancel" autofocus></button>
        <button type="button" class="button danger" id="delete-confirm" data-i18n="delete.confirm"></button>
      </div>
    </dialog>
  </body>
</html>
