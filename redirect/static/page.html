<!doctype html>
<!-- Server-rendered page (404, 403, 503): main.render_page fills each double-brace placeholder with HTML-escaped text. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{{ title }}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="card standalone">
        <h1>{{ title }}</h1>
        <p>{{ text }}</p>
        <a class="button primary" href="/">{{ back }}</a>
      </div>
    </main>
  </body>
</html>
