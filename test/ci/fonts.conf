<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Screenshot fonts. The UI brings its own web fonts; DejaVu (fonts-dejavu-core) is the only system
     fallback, for the few glyphs outside the web fonts' subset. GNU Unifont and FreeFont are rejected
     in case a future package pulls them in: fontconfig would otherwise prefer them for some glyphs. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/unifont/*</glob>
      <glob>*/freefont/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
