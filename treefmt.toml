# The single lint / format entry point.
#   just lint   checks every formatter and linter, modifies nothing (CI job "lint")
#   just fmt    applies the formatters
# Files are listed through git: ignored files (.gitignore, .git/info/exclude) are never visited.

excludes = [
  ".git/**", "**/__pycache__/**", "**/.venv/**", "**/.ruff_cache/**", "**/.mypy_cache/**", "test-reports/**",
  "test/screenshot/**",          # GUI goldens: byte-exact PNGs, regenerated by the scenario only
  "test/redirect/fixtures/**",   # scenario fixtures (SQLite database): byte-pinned, never rewritten
]
on-unmatched = "debug"

[formatter.ruff-format]
command = "test/ci/format.sh"
options = ["ruff-format"]
includes = ["*.py"]
priority = 1

[formatter.ruff-check]           # lint only, never fixes by itself
command = "ruff"
options = ["check", "--no-fix", "--output-format=concise"]
includes = ["*.py"]
priority = 2

# HTML stays out: formatting it can change rendered text. JavaScript stays out too: the front end is
# plain, unbuilt JS whose behaviour is checked in the browser scenario.
[formatter.prettier]
command = "test/ci/format.sh"
options = ["prettier"]
includes = ["*.css", "*.yml", "*.yaml", "*.md"]

[formatter.json]                 # every JSON must parse; checked, never rewritten
command = "python3"
options = ["test/ci/check_json.py"]
includes = ["*.json"]

[formatter.typecheck]            # mypy --strict on the app package (checks the whole package, whatever the file)
command = "test/ci/typecheck.sh"
includes = ["redirect/*.py"]
