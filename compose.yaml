# Redirect in one command: docker compose up -d
# The container gets its own address on the LAN (macvlan below), so the links need no port: the interface is
# at http://192.168.1.20/, and the links read http://redirect.lan/redirect/<path>. Point redirect.lan at that
# address in your router's DNS, or change or turn off the hostname in the interface (Links card).
# Redirections live in the named volume below: they survive restarts, upgrades and `docker compose down`.
services:
  redirect:
    # A released image; pin a version (ghcr.io/cestmoiroma/redirect:0.1.0) to upgrade on your own terms.
    # REDIRECT_IMAGE runs another one, e.g. redirect:local built from this repository by `just image`.
    image: ${REDIRECT_IMAGE:-ghcr.io/cestmoiroma/redirect:latest}
    restart: unless-stopped
    networks:
      lan:
        # A free address of your LAN, outside the range your router's DHCP hands out
        ipv4_address: 192.168.1.20
    volumes:
      - redirect-data:/data
    environment:
      # Admin password, 8 characters or more: the interface asks for it, and it lets you generate the API key
      # scripts use. Left empty, the interface and the API are open to anyone who can reach them, and every
      # page says so in red. Changing it logs every session out.
      ADMIN_PASSWORD: ''
      # Port the server listens on: 80 unless you need another one
      # PORT: 80
      # Scripts' API: off until turned on in the interface (API card). true or false here forces it.
      # API_ENABLED: 'true'
      # The interface and the API only answer the local network, unless turned off in the interface (Access
      # card). true or false here forces it. The links work from anywhere either way.
      # LOCAL_ONLY: 'true'
      # No interface at all: the API only, with the API key, written once to the log on the first start
      # (docker compose logs redirect). A new key: docker compose exec redirect python -m redirect api-key
      # HEADLESS: 'true'
      # Days the log keeps its events
      # LOG_RETENTION_DAYS: 90
      # Base of the public links, over the hostname of the interface: set it for a reverse proxy serving HTTPS.
      # PUBLIC_BASE_URL: https://go.example.org
      # Addresses whose X-Forwarded-* headers are trusted (scheme and client IP). The default trusts the
      # loopback only. Set it to your reverse proxy's address, or set PUBLIC_BASE_URL above, which always wins.
      # FORWARDED_ALLOW_IPS: 192.168.1.30

networks:
  lan:
    driver: macvlan
    driver_opts:
      # The host's network interface on that LAN (see `ip link`)
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

volumes:
  redirect-data:
